{{- if .Values.podry.secretKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.podry.secretName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "podry.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range .Values.podry.secretKeys }}
  {{ . | quote }}: {{ index $.Values.podry.secretData . | quote }}
  {{- end }}
{{- end }}
