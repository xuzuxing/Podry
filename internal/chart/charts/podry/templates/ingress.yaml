{{- if and (eq .Values.podry.workloadKind "Deployment") .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "podry.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name | quote }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
